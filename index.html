<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Upgrade Store</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f4f4;
      color:#222;
    }

    header{
      background:#111827;
      color:white;
      padding:20px;
      text-align:center;
      position:sticky;
      top:0;
      z-index:100;
    }

    header h1{
      font-size:28px;
    }

    .cart-icon{
      position:absolute;
      right:20px;
      top:20px;
      font-size:24px;
      cursor:pointer;
    }

    .cart-count{
      background:red;
      color:white;
      border-radius:50%;
      padding:2px 7px;
      font-size:12px;
      position:absolute;
      top:-8px;
      right:-10px;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .category-title{
      margin:30px 0 15px;
      font-size:24px;
      color:#111827;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .product-logo{
      width:70px;
      height:70px;
      background:#111827;
      border-radius:15px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:26px;
      margin-bottom:15px;
    }

    .card h3{
      margin-bottom:10px;
    }

    .price{
      font-size:20px;
      font-weight:bold;
      color:#16a34a;
      margin-bottom:15px;
    }

    .btn{
      background:#111827;
      color:white;
      border:none;
      padding:10px;
      width:100%;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
    }

    .btn:hover{
      background:#374151;
    }

    .cart-modal{
      position:fixed;
      top:0;
      right:-100%;
      width:350px;
      height:100%;
      background:white;
      box-shadow:-5px 0 15px rgba(0,0,0,0.2);
      transition:0.4s;
      z-index:999;
      padding:20px;
      overflow:auto;
    }

    .cart-modal.active{
      right:0;
    }

    .cart-item{
      border-bottom:1px solid #ddd;
      padding:10px 0;
    }

    .cart-item h4{
      margin-bottom:5px;
    }

    .total{
      margin-top:20px;
      font-size:18px;
      font-weight:bold;
    }

    .checkout-btn{
      margin-top:20px;
      background:#16a34a;
      color:white;
      border:none;
      width:100%;
      padding:14px;
      border-radius:10px;
      font-size:16px;
      cursor:pointer;
    }

    .checkout-btn:hover{
      background:#15803d;
    }
  </style>
</head>

<body>

<header>
  <h1>Digital Upgrade Store</h1>

  <div class="cart-icon" onclick="toggleCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span class="cart-count" id="cartCount">0</span>
  </div>
</header>

<div class="container">

  <h2 class="category-title">Upgrade E-Wallet</h2>
  <div class="products" id="ewallet"></div>

  <h2 class="category-title">Upgrade Aplikasi PPOB</h2>
  <div class="products" id="ppob"></div>

  <h2 class="category-title">Upgrade Bank Digital</h2>
  <div class="products" id="bank"></div>

</div>

<div class="cart-modal" id="cartModal">
  <h2>Detail Pesanan</h2>

  <div id="cartItems"></div>

  <div class="total" id="subtotal"></div>
  <div class="total" id="adminFee"></div>
  <div class="total" id="grandTotal"></div>

  <button class="checkout-btn" onclick="checkoutWA()">
    Buat Pesanan
  </button>
</div>

<script>

const admin = 500;

const products = [

  // E-Wallet
  {name:"DANA", price:35000, category:"ewallet"},
  {name:"OVO", price:35000, category:"ewallet"},
  {name:"GoPay", price:35000, category:"ewallet"},
  {name:"LinkAja", price:35000, category:"ewallet"},
  {name:"DANA Bisnis", price:35000, category:"ewallet"},
  {name:"iSaku", price:35000, category:"ewallet"},
  {name:"ShopeePay", price:35000, category:"ewallet"},

  // PPOB
  {name:"Order Kuota", price:36000, category:"ppob"},
  {name:"Top Indoku", price:36000, category:"ppob"},
  {name:"Top Pulsa", price:36000, category:"ppob"},
  {name:"PPOB Premium", price:36000, category:"ppob"},
  {name:"TopUp Center", price:36000, category:"ppob"},
  {name:"Agen Digital", price:36000, category:"ppob"},
  {name:"PPOB Plus", price:36000, category:"ppob"},

  // Bank
  {name:"SeaBank", price:39000, category:"bank"},
  {name:"Bank Jago", price:39000, category:"bank"},
  {name:"Neo Bank", price:39000, category:"bank"},
  {name:"blu BCA", price:39000, category:"bank"},
  {name:"Jenius", price:39000, category:"bank"},
  {name:"PermataME", price:39000, category:"bank"}

];

let cart = [];

function renderProducts(){

  products.forEach(product=>{

    const card = `
      <div class="card">

        <div class="product-logo">
          <i class="fa-solid fa-wallet"></i>
        </div>

        <h3>${product.name}</h3>

        <div class="price">
          Rp ${product.price.toLocaleString("id-ID")}
        </div>

        <button class="btn"
          onclick='addToCart(${JSON.stringify(product)})'>
          Pesan Sekarang
        </button>

      </div>
    `;

    document.getElementById(product.category)
      .innerHTML += card;
  });

}

function addToCart(product){

  cart.push(product);

  updateCart();

  toggleCart();
}

function updateCart(){

  document.getElementById("cartCount").innerText = cart.length;

  let itemsHTML = "";
  let subtotal = 0;

  cart.forEach(item=>{

    subtotal += item.price;

    itemsHTML += `
      <div class="cart-item">
        <h4>${item.name}</h4>
        <p>Rp ${item.price.toLocaleString("id-ID")}</p>
      </div>
    `;
  });

  const total = subtotal + admin;

  document.getElementById("cartItems").innerHTML = itemsHTML;

  document.getElementById("subtotal").innerHTML =
    `Subtotal : Rp ${subtotal.toLocaleString("id-ID")}`;

  document.getElementById("adminFee").innerHTML =
    `Biaya Website : Rp ${admin.toLocaleString("id-ID")}`;

  document.getElementById("grandTotal").innerHTML =
    `Total : Rp ${total.toLocaleString("id-ID")}`;

}

function toggleCart(){

  document.getElementById("cartModal")
    .classList.toggle("active");
}

function checkoutWA(){

  if(cart.length === 0){
    alert("Keranjang masih kosong!");
    return;
  }

  let text = "Halo, saya ingin memesan:%0A%0A";

  let subtotal = 0;

  cart.forEach((item,index)=>{

    subtotal += item.price;

    text += `${index+1}. ${item.name} - Rp ${item.price.toLocaleString("id-ID")}%0A`;
  });

  const total = subtotal + admin;

  text += `%0ASubtotal : Rp ${subtotal.toLocaleString("id-ID")}`;
  text += `%0ABiaya Website : Rp ${admin.toLocaleString("id-ID")}`;
  text += `%0ATotal : Rp ${total.toLocaleString("id-ID")}`;

  // GANTI NOMOR WA DI BAWAH
  const phone = "+6287895917725";

  window.open(`https://wa.me/${phone}?text=${text}`,'_blank');
}

renderProducts();

</script>

</body>
</html>
